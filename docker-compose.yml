services:
  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      PLATFORM_DB_PATH: /data/platform.db
    volumes:
      - platform-data:/data
      - generated:/app/generated
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  platform-data:
  generated:
